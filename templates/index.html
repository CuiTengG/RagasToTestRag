<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ragas 测试集生成器</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
      }

      .header {
        text-align: center;
        color: white;
        margin-bottom: 30px;
      }

      .header h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
      }

      .header p {
        font-size: 1.1rem;
        opacity: 0.9;
      }

      .nav-links {
        text-align: center;
        margin-bottom: 20px;
      }

      .nav-links a {
        color: white;
        text-decoration: none;
        padding: 8px 20px;
        border: 2px solid rgba(255, 255, 255, 0.6);
        border-radius: 20px;
        margin: 0 8px;
        transition: all 0.3s;
      }

      .nav-links a:hover,
      .nav-links a.active {
        background: white;
        color: #667eea;
      }

      .card {
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        margin-bottom: 20px;
      }

      .upload-area {
        border: 3px dashed #667eea;
        border-radius: 8px;
        padding: 40px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        background: #f8f9ff;
      }

      .upload-area:hover {
        border-color: #764ba2;
        background: #f0f2ff;
      }

      .upload-area.dragover {
        border-color: #764ba2;
        background: #e8ebff;
      }

      .upload-icon {
        font-size: 48px;
        margin-bottom: 15px;
        color: #667eea;
      }

      .upload-text {
        color: #555;
        font-size: 16px;
      }

      .upload-text strong {
        color: #667eea;
      }

      #file-input {
        display: none;
      }

      .selected-file {
        margin-top: 15px;
        padding: 12px 15px;
        background: #e8f5e9;
        border-radius: 6px;
        color: #2e7d32;
        display: none;
        max-height: 150px;
        overflow-y: auto;
      }

      .selected-file .file-list-title {
        font-weight: 600;
        margin-bottom: 6px;
      }

      .selected-file .file-item {
        padding: 3px 0;
        font-size: 14px;
        color: #388e3c;
      }

      .selected-file .file-item::before {
        content: "📎 ";
      }

      .form-group {
        margin: 20px 0;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
      }

      .form-group input[type="number"] {
        width: 100%;
        padding: 12px;
        border: 2px solid #ddd;
        border-radius: 6px;
        font-size: 16px;
        transition: border-color 0.3s ease;
      }

      .form-group input[type="number"]:focus {
        outline: none;
        border-color: #667eea;
      }

      .btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      .btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .progress-container {
        display: none;
        margin-top: 20px;
      }

      .progress-bar {
        height: 8px;
        background: #e0e0e0;
        border-radius: 4px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        width: 0%;
        transition: width 0.3s ease;
      }

      .status-text {
        text-align: center;
        margin-top: 10px;
        color: #666;
      }

      .result-container {
        display: none;
      }

      .success-message {
        background: #e8f5e9;
        border-left: 4px solid #4caf50;
        padding: 15px;
        margin-bottom: 20px;
        border-radius: 4px;
      }

      .error-message {
        background: #ffebee;
        border-left: 4px solid #f44336;
        padding: 15px;
        margin-bottom: 20px;
        border-radius: 4px;
        color: #c62828;
      }

      .preview-section {
        margin-top: 20px;
      }

      .preview-title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 10px;
        color: #333;
      }

      .preview-table {
        width: 100%;
        border-collapse: collapse;
        overflow-x: auto;
        display: block;
      }

      .preview-table th,
      .preview-table td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #ddd;
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .preview-table th {
        background: #f5f5f5;
        font-weight: 600;
        color: #333;
      }

      .download-btn {
        display: inline-block;
        padding: 12px 24px;
        background: #4caf50;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-weight: 600;
        margin-top: 15px;
        transition: background 0.3s ease;
      }

      .download-btn:hover {
        background: #45a049;
      }

      .loading-spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 1s linear infinite;
        margin-right: 8px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>📝 Ragas 测试集生成器</h1>
        <p>上传文档，自动生成 RAG 系统评估测试集</p>
      </div>

      <div class="nav-links">
        <a href="/" class="active">📝 生成测试集</a>
        <a href="/evaluate">📊 评测 RAG 系统</a>
      </div>

      <div class="card">
        <div class="upload-area" id="upload-area">
          <div class="upload-icon">📄</div>
          <div class="upload-text">
            <strong>点击选择文件</strong> 或拖拽文件到此处<br />
            支持 PDF、TXT、DOCX、DOC、XLSX 格式<br />
            <small style="color: #888">可同时上传多个文件</small>
          </div>
          <input
            type="file"
            id="file-input"
            accept=".pdf,.txt,.docx,.doc,.xlsx"
            multiple
          />
        </div>

        <div class="selected-file" id="selected-file">
          ✅ 已选择文件: <span id="file-name"></span>
        </div>

        <div class="form-group">
          <label for="test-size">测试集大小（条数）:</label>
          <input type="number" id="test-size" min="1" max="50" value="10" />
        </div>

        <button class="btn" id="generate-btn" onclick="generateTestset()">
          🚀 生成测试集
        </button>

        <div class="progress-container" id="progress-container">
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <div class="status-text" id="status-text">正在处理...</div>
        </div>
      </div>

      <div class="card result-container" id="result-container">
        <div id="result-content"></div>
      </div>
    </div>

    <script>
      // 多文件上传交互逻辑
      const uploadArea = document.getElementById("upload-area");
      const fileInput = document.getElementById("file-input");
      const selectedFile = document.getElementById("selected-file");
      const fileName = document.getElementById("file-name");

      // 点击上传区域触发文件选择器
      uploadArea.addEventListener("click", () => fileInput.click());

      // 拖拽上传 - 拖入时高亮
      uploadArea.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadArea.classList.add("dragover");
      });

      // 拖拽上传 - 离开时取消高亮
      uploadArea.addEventListener("dragleave", () => {
        uploadArea.classList.remove("dragover");
      });

      // 拖拽上传 - 放下文件时处理
      uploadArea.addEventListener("drop", (e) => {
        e.preventDefault();
        uploadArea.classList.remove("dragover");
        const files = e.dataTransfer.files;
        if (files.length > 0) {
          fileInput.files = files;
          handleFileSelect(files);
        }
      });

      fileInput.addEventListener("change", (e) => {
        if (e.target.files.length > 0) {
          handleFileSelect(e.target.files);
        }
      });

      // 验证所有文件格式，过滤无效文件，显示文件列表
      function handleFileSelect(files) {
        const validTypes = [".pdf", ".txt", ".docx", ".doc", ".xlsx"];
        const validFiles = [];
        const invalidFiles = [];

        for (const file of files) {
          const fileExt = "." + file.name.split(".").pop().toLowerCase();
          if (validTypes.includes(fileExt)) {
            validFiles.push(file);
          } else {
            invalidFiles.push(file.name);
          }
        }

        if (invalidFiles.length > 0) {
          alert(
            "以下文件格式不支持:\n" +
              invalidFiles.join("\n") +
              "\n\n支持: PDF、TXT、DOCX、DOC、XLSX",
          );
        }

        if (validFiles.length === 0) {
          selectedFile.style.display = "none";
          return;
        }

        // 用 DataTransfer 重新构建 fileList（仅包含有效文件）
        const dt = new DataTransfer();
        validFiles.forEach((f) => dt.items.add(f));
        fileInput.files = dt.files;

        let html =
          '<div class="file-list-title">✅ 已选择 ' +
          validFiles.length +
          " 个文件:</div>";
        for (const f of validFiles) {
          html +=
            '<div class="file-item">' +
            f.name +
            " (" +
            formatSize(f.size) +
            ")</div>";
        }
        selectedFile.innerHTML = html;
        selectedFile.style.display = "block";
      }

      // 格式化文件大小显示（B / KB / MB）
      function formatSize(bytes) {
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
        return (bytes / (1024 * 1024)).toFixed(1) + " MB";
      }

      // 测试集生成主流程
      async function generateTestset() {
        if (!fileInput.files || fileInput.files.length === 0) {
          alert("请先选择要上传的文件");
          return;
        }

        const btn = document.getElementById("generate-btn");
        const progressContainer = document.getElementById("progress-container");
        const progressFill = document.getElementById("progress-fill");
        const statusText = document.getElementById("status-text");
        const resultContainer = document.getElementById("result-container");
        const resultContent = document.getElementById("result-content");

        // 禁用按钮，显示加载状态
        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner"></span>正在生成...';
        progressContainer.style.display = "block";
        resultContainer.style.display = "none";
        progressFill.style.width = "0%";

        try {
          const formData = new FormData();
          // 添加所有文件到表单（支持多文件）
          for (const file of fileInput.files) {
            formData.append("files", file);
          }
          formData.append(
            "test_size",
            document.getElementById("test-size").value,
          );

          const fileCount = fileInput.files.length;
          progressFill.style.width = "30%";
          statusText.textContent = "正在上传 " + fileCount + " 个文件...";

          // 发送请求到后端 /upload 接口
          const response = await fetch("/upload", {
            method: "POST",
            body: formData,
          });

          progressFill.style.width = "70%";
          statusText.textContent = "正在生成测试集...";

          const result = await response.json();

          if (response.ok && result.success) {
            progressFill.style.width = "100%";
            statusText.textContent = "完成！";

            // 构建数据预览表格（前 5 条）
            let previewHtml = "";
            if (result.preview && result.preview.length > 0) {
              const keys = Object.keys(result.preview[0]);
              previewHtml = `
                            <div class="preview-section">
                                <h3 class="preview-title">📊 测试数据预览（前5条）</h3>
                                <table class="preview-table">
                                    <thead>
                                        <tr>${keys.map((key) => `<th>${key}</th>`).join("")}</tr>
                                    </thead>
                                    <tbody>
                                        ${result.preview
                                          .map(
                                            (row) => `
                                            <tr>${keys.map((key) => `<td>${row[key] || "-"}</td>`).join("")}</tr>
                                        `,
                                          )
                                          .join("")}
                                    </tbody>
                                </table>
                            </div>
                        `;
            }

            // 构建来源文件信息
            let fileInfoHtml = "";
            if (result.file_list) {
              fileInfoHtml =
                '<div style="margin-top:10px;font-size:13px;color:#666;">📁 来源文件: ' +
                result.file_list.join(", ") +
                "<br>📊 文档块数: " +
                result.total_chunks +
                "</div>";
            }

            resultContent.innerHTML = `
                        <div class="success-message">
                            ✅ ${result.message}
                        </div>
                        ${previewHtml}
                        ${fileInfoHtml}
                        <a href="${result.download_url}" class="download-btn" download>
                            ⬇️ 下载完整测试集（JSON格式）
                        </a>
                    `;

            resultContainer.style.display = "block";
          } else {
            throw new Error(result.error || "生成失败");
          }
        } catch (error) {
          console.error("Error:", error);
          resultContent.innerHTML = `
                    <div class="error-message">
                        ❌ 错误: ${error.message}
                    </div>
                `;
          resultContainer.style.display = "block";
        } finally {
          // 恢复按钮状态
          btn.disabled = false;
          btn.innerHTML = "🚀 生成测试集";
        }
      }
    </script>
  </body>
</html>
